<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SF Butterfly × Plant Explorer</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: #0d1117;
  color: #e6edf3;
  display: flex;
  flex-direction: column;
  height: 100dvh;
  overflow: hidden;
}
#topbar {
  background: #161b22;
  border-bottom: 1px solid #30363d;
  padding: 8px 12px 6px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  flex-shrink: 0;
  z-index: 10;
}
.bar-row { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
.bar-row-1 { justify-content: space-between; }
#app-title { font-size: 14px; font-weight: 700; color: #58a6ff; white-space: nowrap; flex-shrink: 0; }
#app-title span { color: #8b949e; font-weight: 400; font-size: 11px; margin-left: 6px; }
#search {
  background: #0d1117; border: 1px solid #30363d; border-radius: 20px;
  color: #e6edf3; font-size: 12px; padding: 4px 12px; width: 160px; outline: none; flex-shrink: 0;
}
#search:focus { border-color: #58a6ff; }
#search::placeholder { color: #484f58; }
#stats { font-size: 11px; color: #8b949e; white-space: nowrap; flex-shrink: 0; }
#stats strong { color: #c9d1d9; }
.rel-pills { display: flex; gap: 5px; flex-shrink: 0; }
.rel-pill {
  cursor: pointer; border-radius: 20px; padding: 3px 11px; font-size: 12px;
  font-weight: 500; border: 1.5px solid transparent; user-select: none;
  transition: opacity .15s; white-space: nowrap;
}
.rel-pill.host   { background: rgba(220,80,50,.18); border-color: #dc5032; color: #ff8060; }
.rel-pill.nectar { background: rgba(240,185,50,.18); border-color: #f0b932; color: #f0d060; }
.rel-pill.other  { background: rgba(120,120,130,.12); border-color: #555; color: #8b949e; }
.rel-pill.off    { opacity: .3; }
#plant-fam-select {
  background: #0d1117; border: 1px solid #30363d; border-radius: 6px;
  color: #e6edf3; font-size: 12px; padding: 3px 7px; outline: none; cursor: pointer; max-width: 180px;
}
#plant-fam-select:focus { border-color: #58a6ff; }
.bar-row-3 { overflow-x: auto; flex-wrap: nowrap; scrollbar-width: none; -ms-overflow-style: none; }
.bar-row-3::-webkit-scrollbar { display: none; }
.family-pills { display: flex; gap: 5px; }
.fam-pill {
  cursor: pointer; border-radius: 20px; padding: 2px 10px; font-size: 11px;
  font-weight: 500; border: 1.5px solid; user-select: none; transition: opacity .15s;
  white-space: nowrap; flex-shrink: 0;
}
.fam-pill.off { opacity: .25; }
#graph-wrap { flex: 1; overflow: hidden; position: relative; }
#graph { width: 100%; height: 100%; }
#tooltip {
  position: fixed; pointer-events: none; background: rgba(13,17,23,.97);
  border: 1px solid #30363d; border-radius: 10px; padding: 10px 13px;
  max-width: 200px; z-index: 300; box-shadow: 0 4px 20px rgba(0,0,0,.6); display: none;
}
#tooltip .tt-common { font-size: 13px; font-weight: 700; margin-bottom: 1px; }
#tooltip .tt-latin  { font-size: 11px; font-style: italic; color: #8b949e; margin-bottom: 5px; }
#tooltip .tt-family { font-size: 11px; color: #58a6ff; margin-bottom: 2px; }
#tooltip .tt-obs    { font-size: 11px; color: #8b949e; }
#tooltip .tt-deg    { font-size: 11px; color: #8b949e; }
#info-panel {
  position: absolute; bottom: 14px; right: 14px; background: rgba(22,27,34,.97);
  border: 1px solid #30363d; border-radius: 10px; padding: 12px 16px;
  max-width: 260px; display: none; box-shadow: 0 4px 24px rgba(0,0,0,.6); z-index: 50;
}
#info-panel .ip-name  { font-size: 15px; font-weight: 700; margin-bottom: 1px; }
#info-panel .ip-latin { font-size: 11px; font-style: italic; color: #8b949e; margin-bottom: 7px; }
#info-panel .ip-meta  { font-size: 11.5px; color: #8b949e; line-height: 1.7; white-space: pre-line; }
#info-panel .ip-close {
  position: absolute; top: 9px; right: 11px; cursor: pointer; font-size: 15px;
  color: #555; background: none; border: none; line-height: 1;
}
#info-panel .ip-close:hover { color: #e6edf3; }
#legend {
  position: absolute; bottom: 14px; left: 14px; background: rgba(13,17,23,.88);
  border: 1px solid #30363d; border-radius: 8px; padding: 8px 12px;
  font-size: 11px; color: #8b949e; line-height: 1.9; z-index: 50; pointer-events: none;
}
.leg-dot  { display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:middle; }
.leg-line { display:inline-block;width:18px;height:2px;border-radius:1px;margin-right:5px;vertical-align:middle; }
</style>
</head>
<body>

<div id="topbar">

    <div id="stats"></div>
  </div>
  <div class="bar-row bar-row-2">
    <div class="rel-pills">
      <div class="rel-pill host"      data-rel="host">🔴 Host plant</div>
      <div class="rel-pill nectar"    data-rel="nectar">🟡 Nectar plant</div>
      <div class="rel-pill other off" data-rel="other">⚪ Other</div>
    </div>
    <select id="plant-fam-select"><option value="">All plant families</option></select>
  </div>
  <div class="bar-row bar-row-3">
    <div class="family-pills" id="bfly-family-pills"></div>
  </div>
</div>

<div id="graph-wrap">
  <svg id="graph"></svg>
  <div id="legend"></div>
  <div id="info-panel">
    <button class="ip-close">✕</button>
    <div class="ip-name"></div>
    <div class="ip-latin"></div>
    <div class="ip-meta"></div>
  </div>
</div>

<div id="tooltip">
  <div class="tt-common"></div>
  <div class="tt-latin"></div>
  <div class="tt-family"></div>
  <div class="tt-obs"></div>
  <div class="tt-deg"></div>
</div>

{

function init(DATA) {
  const nodeById = Object.fromEntries(DATA.nodes.map(n=>[n.id,n]));
  const bflyFams = [...new Set(DATA.nodes.filter(n=>n.type==="butterfly").map(n=>n.family))].sort();
  const plantFams= [...new Set(DATA.nodes.filter(n=>n.type==="plant").map(n=>n.family))].sort();
  bflyFams.forEach(f=>state.bflyFamilies.add(f));

  const pillsEl = document.getElementById("bfly-family-pills");
  bflyFams.forEach(fam=>{
    const col=BFLY_COLORS[fam]||"#aaa";
    const el=document.createElement("div");
    el.className="fam-pill"; el.dataset.fam=fam; el.textContent=fam;
    el.style.cssText=`border-color:${col};color:${col};background:${hexAlpha(col,.12)}`;
    el.addEventListener("click",()=>{
      if(state.bflyFamilies.has(fam)&&state.bflyFamilies.size>1) state.bflyFamilies.delete(fam);
      else state.bflyFamilies.add(fam);
      update();
    });
    pillsEl.appendChild(el);
  });

  const plantSel=document.getElementById("plant-fam-select");
  plantFams.forEach(f=>{ const o=document.createElement("option"); o.value=f; o.textContent=f; plantSel.appendChild(o); });
  plantSel.addEventListener("change",()=>{ state.plantFamily=plantSel.value; update(); });

  document.querySelectorAll(".rel-pill").forEach(el=>el.addEventListener("click",()=>{
    const r=el.dataset.rel;
    if(r==="host")   state.showHost  =!state.showHost;
    if(r==="nectar") state.showNectar=!state.showNectar;
    if(r==="other")  state.showOther =!state.showOther;
    update();
  }));
  document.getElementById("search").addEventListener("input",e=>{
    state.searchQuery=e.target.value.toLowerCase().trim(); update();
  });
  document.querySelector(".ip-close").addEventListener("click",()=>{
    state.focusId=null; document.getElementById("info-panel").style.display="none"; update();
  });

  const wrap=document.getElementById("graph-wrap");
  let W=wrap.clientWidth, H=wrap.clientHeight;
  const svg=d3.select("#graph").attr("width",W).attr("height",H);
  const defs=svg.append("defs");
  const g=svg.append("g");

  g.append("rect").attr("x",-50000).attr("y",-50000).attr("width",100000).attr("height",100000)
    .attr("fill","transparent")
    .on("click",()=>{ state.focusId=null; document.getElementById("info-panel").style.display="none"; update(); });

  svg.call(d3.zoom().scaleExtent([0.08,8]).on("zoom",e=>g.attr("transform",e.transform)));

  const ttEl=document.getElementById("tooltip");
  function showTT(ev,d){
    ttEl.querySelector(".tt-common").textContent=d.common_name||d.id;
    ttEl.querySelector(".tt-latin").textContent =d.common_name?d.id:"";
    ttEl.querySelector(".tt-family").textContent=d.family;
    ttEl.querySelector(".tt-obs").textContent   =d.sf_obs>0?`${d.sf_obs.toLocaleString()} SF obs`:"";
    ttEl.querySelector(".tt-deg").textContent   =`${d.degree} ${d.type==="butterfly"?"plants":"butterflies"}`;
    ttEl.style.display="block"; moveTT(ev);
  }
  function moveTT(ev){
    let x=ev.clientX+14, y=ev.clientY-10;
    if(x+220>window.innerWidth)  x=ev.clientX-220;
    if(y+130>window.innerHeight) y=ev.clientY-130;
    ttEl.style.left=x+"px"; ttEl.style.top=y+"px";
  }
  function hideTT(){ ttEl.style.display="none"; }

  function showInfo(d){
    const p=document.getElementById("info-panel");
    p.querySelector(".ip-name").textContent =d.common_name||d.id;
    p.querySelector(".ip-name").style.color =d.type==="butterfly"?(BFLY_COLORS[d.family]||"#aaa"):PLANT_COLOR;
    p.querySelector(".ip-latin").textContent=d.common_name?d.id:"";
    p.querySelector(".ip-meta").textContent =[
      d.type==="butterfly"?`Family: ${d.family}`:`Plant family: ${d.family}`,
      d.sf_obs>0?`SF observations: ${d.sf_obs.toLocaleString()}`:"",
      `Connections: ${d.degree}`,
    ].filter(Boolean).join("\n");
    p.style.display="block";
  }

  function nodeR(d){ return d.type==="plant"?Math.max(14,5+Math.sqrt(d.degree)*3.5):Math.max(12,4+Math.sqrt(d.degree)*2.8); }
  function nodeColor(d){ return d.type==="plant"?PLANT_COLOR:(BFLY_COLORS[d.family]||"#aaa"); }
  function edgeColor(e){ return e.host?EDGE_HOST:e.nectar?EDGE_NECTAR:EDGE_OTHER; }

  const simNodes=DATA.nodes.map(d=>({...d}));
  const simEdges=DATA.edges.map(e=>({...e}));

  const sim=d3.forceSimulation(simNodes)
    .force("link",d3.forceLink(simEdges).id(d=>d.id).distance(80).strength(0.35))
    .force("charge",d3.forceManyBody().strength(-250))
    .force("center",d3.forceCenter(W/2,H/2))
    .force("collide",d3.forceCollide().radius(d=>nodeR(d)+5))
    .alphaDecay(0.022).on("tick",ticked);

  let edgeSel=g.append("g").attr("class","edges").selectAll("line");
  let nodeSel=g.append("g").attr("class","nodes").selectAll("g.node");

  function getVisible(){
    const visEdges=DATA.edges.filter(e=>{
      const sid=e.source?.id??e.source, tid=e.target?.id??e.target;
      const sn=nodeById[sid], tn=nodeById[tid];
      const bf=sn?.type==="butterfly"?sn:tn, pl=sn?.type==="plant"?sn:tn;
      if(!bf||!pl) return false;
      if(!state.bflyFamilies.has(bf.family)) return false;
      if(state.plantFamily&&pl.family!==state.plantFamily) return false;
      return (state.showHost&&e.host)||(state.showNectar&&e.nectar)||(state.showOther&&!e.host&&!e.nectar);
    });
    const visIds=new Set();
    visEdges.forEach(e=>{ visIds.add(e.source?.id??e.source); visIds.add(e.target?.id??e.target); });
    let searchIds=null;
    if(state.searchQuery){
      searchIds=new Set(DATA.nodes
        .filter(n=>n.id.toLowerCase().includes(state.searchQuery)||n.common_name.toLowerCase().includes(state.searchQuery))
        .map(n=>n.id));
    }
    let focusIds=null;
    if(state.focusId){
      focusIds=new Set([state.focusId]);
      DATA.edges.forEach(e=>{
        const sid=e.source?.id??e.source, tid=e.target?.id??e.target;
        if(sid===state.focusId) focusIds.add(tid);
        if(tid===state.focusId) focusIds.add(sid);
      });
    }
    return {visEdges,visIds,searchIds,focusIds};
  }

  function update(){
    document.querySelector(".rel-pill.host").classList.toggle("off",!state.showHost);
    document.querySelector(".rel-pill.nectar").classList.toggle("off",!state.showNectar);
    document.querySelector(".rel-pill.other").classList.toggle("off",!state.showOther);
    document.querySelectorAll(".fam-pill").forEach(el=>el.classList.toggle("off",!state.bflyFamilies.has(el.dataset.fam)));

    const {visEdges,visIds,searchIds,focusIds}=getVisible();

    edgeSel=g.select(".edges").selectAll("line")
      .data(simEdges,e=>`${e.source?.id??e.source}|${e.target?.id??e.target}`)
      .join("line").attr("stroke",e=>edgeColor(e)).attr("stroke-width",1.5);
    edgeSel.transition().duration(180).attr("stroke-opacity",e=>{
      const sid=e.source?.id??e.source, tid=e.target?.id??e.target;
      if(!visIds.has(sid)||!visIds.has(tid)) return 0;
      const ok=(state.showHost&&e.host)||(state.showNectar&&e.nectar)||(state.showOther&&!e.host&&!e.nectar);
      if(!ok) return 0;
      if(focusIds) return (focusIds.has(sid)&&focusIds.has(tid))?0.8:0.04;
      if(searchIds) return (searchIds.has(sid)||searchIds.has(tid))?0.8:0.05;
      return 0.32;
    });

    nodeSel=g.select(".nodes").selectAll("g.node")
      .data(simNodes,d=>d.id)
      .join(enter=>{
        const gn=enter.append("g").attr("class","node").style("cursor","pointer");
        gn.each(function(d){
          const el=d3.select(this);
          const r=nodeR(d), col=nodeColor(d);
          const cid=`clip-${d.id.replace(/[^a-z0-9]/gi,"_")}`;
          defs.append("clipPath").attr("id",cid).append("circle").attr("r",r);
          if(d.photo_url){
            el.append("image")
              .attr("href",d.photo_url)
              .attr("x",-r).attr("y",-r)
              .attr("width",r*2).attr("height",r*2)
              .attr("clip-path",`url(#${cid})`)
              .attr("preserveAspectRatio","xMidYMid slice")
              .on("error",function(){ d3.select(this).remove(); el.insert("circle",":first-child").attr("r",r).attr("fill",col); });
          } else {
            el.append("circle").attr("r",r).attr("fill",col);
          }
          el.append("circle").attr("r",r).attr("fill","none")
            .attr("stroke",col).attr("stroke-width",d.type==="butterfly"?3:2.5);
        });
        gn.on("mouseover",(ev,d)=>{ showTT(ev,d); d3.select(ev.currentTarget).select("circle:last-child").attr("stroke-width",5); })
          .on("mousemove",moveTT)
          .on("mouseout",(ev,d)=>{ hideTT(); d3.select(ev.currentTarget).select("circle:last-child").attr("stroke-width",d.type==="butterfly"?3:2.5); })
          .on("click",(ev,d)=>{ ev.stopPropagation(); state.focusId=state.focusId===d.id?null:d.id; if(state.focusId)showInfo(d); else document.getElementById("info-panel").style.display="none"; update(); })
          .call(d3.drag()
            .on("start",(e,d)=>{ if(!e.active)sim.alphaTarget(0.3).restart(); d.fx=d.x; d.fy=d.y; })
            .on("drag", (e,d)=>{ d.fx=e.x; d.fy=e.y; })
            .on("end",  (e,d)=>{ if(!e.active)sim.alphaTarget(0); d.fx=null; d.fy=null; }));
        return gn;
      });

    nodeSel.transition().duration(180).attr("opacity",d=>{
      if(!visIds.has(d.id)) return 0;
      if(focusIds) return focusIds.has(d.id)?1:0.08;
      if(searchIds) return searchIds.has(d.id)?1:0.1;
      return 1;
    });
    nodeSel.style("pointer-events",d=>visIds.has(d.id)?"auto":"none");

    const nb=[...visIds].filter(id=>nodeById[id]?.type==="butterfly").length;
    const np=[...visIds].filter(id=>nodeById[id]?.type==="plant").length;
    const nh=visEdges.filter(e=>e.host).length, nn=visEdges.filter(e=>e.nectar).length;
    document.getElementById("stats").innerHTML=
      `<strong>${nb}</strong> butterflies &middot; <strong>${np}</strong> plants &middot; `+
      `<span style="color:#dc5032">${nh} host</span> &middot; <span style="color:#f0b932">${nn} nectar</span>`;
  }

  function ticked(){
    edgeSel.attr("x1",e=>e.source.x).attr("y1",e=>e.source.y).attr("x2",e=>e.target.x).attr("y2",e=>e.target.y);
    nodeSel.attr("transform",d=>`translate(${d.x},${d.y})`);
  }

  update();
  window.addEventListener("resize",()=>{
    W=wrap.clientWidth; H=wrap.clientHeight;
    svg.attr("width",W).attr("height",H);
    sim.force("center",d3.forceCenter(W/2,H/2)).alpha(0.2).restart();
  });
}

function hexAlpha(hex,a){
  const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${a})`;
}
</script>
</body>
</html>
