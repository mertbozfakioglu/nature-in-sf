<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>SF Butterfly Observations</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #111d11;
      color: #cde0cd;
      overflow: hidden;
    }

    #app {
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
    }

    /* ── Header row 1: title + stats + mode toggle ── */
    #header {
      flex: 0 0 auto;
      background: #0a150a;
      border-bottom: 1px solid #243824;
    }

    #header-top {
      padding: 8px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    #title-block h1 {
      font-size: 0.95rem;
      font-weight: 600;
      color: #9fcf9f;
    }

    #title-block h1 em { font-style: italic; color: #7ab07a; }

    .header-sub {
      font-size: 0.68rem;
      color: #3a603a;
      margin-top: 1px;
    }

    /* Mode toggle */
    #mode-toggle {
      display: flex;
      background: #162916;
      border: 1px solid #2a402a;
      border-radius: 20px;
      overflow: hidden;
      flex-shrink: 0;
    }

    .mode-btn {
      padding: 5px 13px;
      border: none;
      background: transparent;
      color: #4a704a;
      cursor: pointer;
      font-size: 0.78rem;
      font-weight: 500;
      transition: background 0.2s, color 0.2s;
    }

    .mode-btn.active { background: var(--species-color, #e8831a); color: #fff; }

    /* Stats */
    #stats {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.78rem;
      color: #4a704a;
    }

    .stat strong { color: #9fcf9f; font-size: 0.88rem; }

    /* ── Species tabs row ── */
    #species-tabs {
      display: flex;
      border-top: 1px solid #1a2e1a;
      overflow-x: auto;
      scrollbar-width: none;
    }

    #species-tabs::-webkit-scrollbar { display: none; }

    .sp-tab {
      flex: 1;
      padding: 7px 10px;
      border: none;
      background: transparent;
      color: #4a704a;
      cursor: pointer;
      font-size: 0.75rem;
      font-weight: 500;
      border-bottom: 2px solid transparent;
      transition: color 0.2s, border-color 0.2s, background 0.2s;
      white-space: nowrap;
      text-align: center;
      line-height: 1.3;
    }

    .sp-tab em { font-style: italic; font-size: 0.68rem; display: block; color: #3a583a; }

    .sp-tab.active {
      color: var(--tab-color);
      border-bottom-color: var(--tab-color);
      background: rgba(255,255,255,0.03);
    }

    .sp-tab.active em { color: var(--tab-color); opacity: 0.7; }

    /* ── Map ── */
    #map { flex: 1; min-height: 0; }

    /* ── Controls ── */
    #controls {
      flex: 0 0 auto;
      background: #0a150a;
      padding: 11px 20px 13px;
      border-top: 1px solid #243824;
    }

    #year-row {
      display: flex;
      align-items: baseline;
      justify-content: center;
      gap: 8px;
      margin-bottom: 9px;
    }

    #year-value {
      font-size: 1.9rem;
      font-weight: 700;
      color: var(--species-color, #e8831a);
      line-height: 1;
      transition: color 0.3s;
    }

    #year-sub { font-size: 0.73rem; color: #4a704a; }

    .slider-outer { padding: 0 10px; }

    #year-slider {
      width: 100%;
      height: 4px;
      -webkit-appearance: none;
      appearance: none;
      border-radius: 2px;
      outline: none;
      cursor: pointer;
      background: #2a402a;
    }

    #year-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 20px; height: 20px;
      border-radius: 50%;
      background: var(--species-color, #e8831a);
      cursor: pointer;
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--species-color, #e8831a) 30%, transparent);
      transition: box-shadow 0.15s;
    }

    #year-slider:active::-webkit-slider-thumb,
    #year-slider:hover::-webkit-slider-thumb {
      box-shadow: 0 0 0 7px color-mix(in srgb, var(--species-color, #e8831a) 20%, transparent);
    }

    #year-slider::-moz-range-thumb {
      width: 20px; height: 20px;
      border-radius: 50%;
      background: var(--species-color, #e8831a);
      cursor: pointer; border: none;
    }

    #ticks {
      position: relative;
      height: 26px;
      margin-top: 3px;
    }

    .tick {
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: center;
      transform: translateX(-50%);
      gap: 2px;
    }

    .tick-mark  { width: 1px; height: 5px; background: #2a402a; }
    .tick-label { font-size: 0.62rem; color: #3a583a; white-space: nowrap; }

    .tick.has-obs .tick-mark  { background: #3d5e3d; }
    .tick.has-obs .tick-label { color: #4a6e4a; }
    .tick.active .tick-mark   { background: var(--species-color, #e8831a); height: 7px; }
    .tick.active .tick-label  { color: var(--species-color, #e8831a); font-weight: 700; }

    /* Legend */
    #legend {
      display: flex;
      justify-content: center;
      gap: 18px;
      margin-top: 9px;
      font-size: 0.73rem;
      color: #4a6e4a;
    }

    .leg-item { display: flex; align-items: center; gap: 5px; }

    .leg-dot {
      width: 15px; height: 15px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 9px;
    }

    .leg-butterfly  { background: var(--species-color, #e8831a); border: 1.5px solid rgba(255,255,255,0.3); }
    .leg-caterpillar { background: #4cae4c; border: 1.5px solid rgba(255,255,255,0.3); }
    .leg-plant      { background: #5a9a5a; border: 1.5px solid rgba(255,255,255,0.3); border-radius: 3px; }

    /* Plant overlay toggle button */
    #overlay-toggle-btn {
      display: none;
      align-items: center;
      gap: 5px;
      background: transparent;
      border: 1px solid #2a402a;
      border-radius: 12px;
      padding: 2px 8px;
      color: #5a9a5a;
      font-size: 0.73rem;
      cursor: pointer;
      transition: background 0.2s, color 0.2s, border-color 0.2s;
    }

    #overlay-toggle-btn.active { background: rgba(90,154,90,0.2); border-color: #5a9a5a; }
    #overlay-toggle-btn.inactive { color: #3a583a; border-color: #243824; }

    /* ── Custom markers ── */
    .m-dot {
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 1px 4px rgba(0,0,0,0.45);
      border: 1.5px solid rgba(255,255,255,0.25);
      font-size: 11px; line-height: 1;
    }

    .m-caterpillar { background: rgba(76,174,76,0.88); border-color: #6dd06d; }
    .m-plant { background: rgba(80,150,80,0.82); border-color: #70c070; border-radius: 3px !important; }

    /* ── Popup overrides ── */
    .leaflet-popup-content-wrapper {
      background: #162916 !important;
      color: #cde0cd !important;
      border: 1px solid #2a4a2a !important;
      border-radius: 8px !important;
      box-shadow: 0 4px 16px rgba(0,0,0,0.5) !important;
    }

    .leaflet-popup-tip { background: #162916 !important; }
    .leaflet-popup-close-button { color: #5a8a5a !important; }

    .popup-body { font-size: 0.82rem; line-height: 1.6; }
    .popup-body a { color: #e8a040; text-decoration: none; }
    .popup-body a:hover { text-decoration: underline; }
    .popup-type { font-weight: 600; margin-bottom: 2px; }

    /* ── Loading overlay ── */
    #loading {
      position: fixed; inset: 0;
      background: rgba(8,15,8,0.93);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      z-index: 10000; gap: 12px;
    }

    #loading h2 { font-size: 1rem; color: #9fcf9f; }
    #loading-msg { font-size: 0.8rem; color: #4a7a4a; min-height: 1.2em; }

    .spinner {
      width: 32px; height: 32px;
      border: 3px solid #2a402a;
      border-top-color: var(--species-color, #e8831a);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .progress-bar-wrap {
      width: 180px; height: 3px;
      background: #1a2a1a; border-radius: 2px; overflow: hidden;
    }

    #progress-bar {
      height: 100%; background: var(--species-color, #e8831a);
      border-radius: 2px; width: 0%; transition: width 0.3s;
    }
  </style>
</head>
<body>
<div id="app">

  <div id="header">
    <div id="header-top">
      <div id="title-block">
        <h1 id="page-title">SF Butterfly Observations</h1>
        <div class="header-sub">San Francisco · iNaturalist · cached data</div>
      </div>
      <div id="stats">
        <span class="stat">🦋 <strong id="s-butterfly">—</strong></span>
        <span class="stat">🐛 <strong id="s-larva">—</strong></span>
        <span class="stat">total <strong id="s-total">—</strong></span>
      </div>
      <div id="mode-toggle">
        <button class="mode-btn active" id="btn-annual"     onclick="setMode('annual')">Annual</button>
        <button class="mode-btn"        id="btn-cumulative" onclick="setMode('cumulative')">Cumulative</button>
      </div>
    </div>

    <div id="species-tabs">
      <!-- populated by JS -->
    </div>
  </div>

  <div id="map"></div>

  <div id="controls">
    <div id="year-row">
      <span id="year-value">—</span>
      <span id="year-sub"></span>
    </div>
    <div class="slider-outer">
      <input type="range" id="year-slider" min="0" max="1" value="1" step="1">
      <div id="ticks"></div>
    </div>
    <div id="legend">
      <div class="leg-item">
        <div class="leg-dot leg-butterfly">🦋</div>
        <span>Butterfly (adult / unlabeled)</span>
      </div>
      <div class="leg-item">
        <div class="leg-dot leg-caterpillar">🐛</div>
        Caterpillar (larva)
      </div>
      <button id="overlay-toggle-btn" onclick="toggleOverlay()">
        <div class="leg-dot leg-plant" style="width:13px;height:13px;font-size:8px">🌿</div>
        <span id="overlay-btn-label">CA Pipevine plant</span>
      </button>
    </div>
  </div>

</div>

<div id="loading">
  <div class="spinner"></div>
  <h2 id="loading-title">Loading observations…</h2>
  <div class="progress-bar-wrap"><div id="progress-bar"></div></div>
  <div id="loading-msg">Fetching data</div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
// ── Species configuration ─────────────────────────────────────────────────
const SPECIES = [
  {
    id:         'checkerspot',
    name:       'Variable Checkerspot',
    scientific: 'Euphydryas chalcedona',
    color:      '#e8831a',
    dataFile:   'data/variable-checkerspot.json',
    overlay:    null
  },
  {
    id:         'pipevine',
    name:       'Pipevine Swallowtail',
    scientific: 'Battus philenor',
    color:      '#6655dd',
    dataFile:   'data/pipevine-swallowtail.json',
    overlay: {
      name:     'California Pipevine',
      scientific:'Aristolochia californica',
      dataFile: 'data/ca-pipevine-plant.json'
    }
  },
  {
    id:         'hairstreak',
    name:       'Coastal Green Hairstreak',
    scientific: 'Callophrys viridis',
    color:      '#2da84e',
    dataFile:   'data/coastal-green-hairstreak.json',
    overlay:    null
  }
];

// ── App state ─────────────────────────────────────────────────────────────
let map;
let allObs     = [];
let byYear     = {};
let years      = [];
let yearLayers = {};
let currentIdx = 0;
let mode       = 'annual';
let speciesIdx = 0;
let ICONS      = {};
let switching  = false;

// Overlay (host plant) state
let overlayByYear  = {};
let overlayYears   = [];
let overlayLayers  = {};
let showOverlay    = true;
const PLANT_ICON   = L.divIcon({
  html: '<div class="m-dot m-plant" style="width:16px;height:16px;font-size:10px">🌿</div>',
  className: '', iconSize: [16,16], iconAnchor: [8,8], popupAnchor: [0,-10]
});

// ── CSS variable helper ───────────────────────────────────────────────────
function setSpeciesColor(color) {
  document.documentElement.style.setProperty('--species-color', color);
}

// ── Map init ──────────────────────────────────────────────────────────────
function initMap() {
  map = L.map('map').setView([37.7595, -122.4492], 13);

  L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
    attribution: '&copy; <a href="https://openstreetmap.org/copyright" target="_blank">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions" target="_blank">CARTO</a>',
    subdomains: 'abcd',
    maxZoom: 19
  }).addTo(map);
}

// ── Icons ─────────────────────────────────────────────────────────────────
function buildIcons(color) {
  const butterfly = L.divIcon({
    html: `<div class="m-dot" style="width:20px;height:20px;background:${color}cc;border-color:${color}">🦋</div>`,
    className: '', iconSize: [20,20], iconAnchor: [10,10], popupAnchor: [0,-12]
  });
  const caterpillar = L.divIcon({
    html: `<div class="m-dot m-caterpillar" style="width:20px;height:20px">🐛</div>`,
    className: '', iconSize: [20,20], iconAnchor: [10,10], popupAnchor: [0,-12]
  });
  return { butterfly, caterpillar };
}

// ── Build marker layers ───────────────────────────────────────────────────
function buildMarkerLayers() {
  yearLayers = {};
  for (const year of years) {
    const lg = L.layerGroup();
    for (const obs of byYear[year]) {
      const icon = obs.isLarva ? ICONS.caterpillar : ICONS.butterfly;
      const label = obs.isLarva ? '🐛 Caterpillar (larva)' : '🦋 Butterfly';
      L.marker([obs.lat, obs.lng], { icon })
        .bindPopup(
          `<div class="popup-body">
            <div class="popup-type">${label}</div>
            <div>Date: ${obs.date}</div>
            <div><a href="${obs.url}" target="_blank" rel="noopener">View on iNaturalist ↗</a></div>
          </div>`, { maxWidth: 240 })
        .addTo(lg);
    }
    yearLayers[year] = lg;
  }
}

// ── Display update ────────────────────────────────────────────────────────
function updateDisplay() {
  const currentYear = years[currentIdx];

  for (const yr of years) {
    const layer = yearLayers[yr];
    const show = mode === 'annual' ? (yr === currentYear) : (yr <= currentYear);
    if (show && !map.hasLayer(layer)) layer.addTo(map);
    if (!show && map.hasLayer(layer)) map.removeLayer(layer);
  }

  let nButterfly = 0, nLarva = 0;
  for (const yr of years) {
    const include = mode === 'annual' ? (yr === currentYear) : (yr <= currentYear);
    if (!include) continue;
    for (const o of byYear[yr]) { if (o.isLarva) nLarva++; else nButterfly++; }
  }

  document.getElementById('s-butterfly').textContent = nButterfly;
  document.getElementById('s-larva').textContent     = nLarva;
  document.getElementById('s-total').textContent     = nButterfly + nLarva;
  document.getElementById('year-value').textContent  = currentYear;
  document.getElementById('year-sub').textContent    =
    mode === 'annual'
      ? `· ${nButterfly + nLarva} observation${nButterfly + nLarva !== 1 ? 's' : ''}`
      : `· cumulative ${years[0]}–${currentYear}`;

  updateOverlayDisplay(currentYear);

  document.querySelectorAll('.tick').forEach((el, i) => {
    el.classList.toggle('active', i === currentIdx);
  });

  const pct = years.length > 1 ? (currentIdx / (years.length - 1)) * 100 : 100;
  const sp = SPECIES[speciesIdx];
  document.getElementById('year-slider').style.background =
    `linear-gradient(to right, ${sp.color} 0%, ${sp.color} ${pct}%, #2a402a ${pct}%, #2a402a 100%)`;
}

// ── Mode toggle ───────────────────────────────────────────────────────────
function setMode(m) {
  mode = m;
  document.getElementById('btn-annual').classList.toggle('active', m === 'annual');
  document.getElementById('btn-cumulative').classList.toggle('active', m === 'cumulative');
  updateDisplay();
}

// ── Slider setup ──────────────────────────────────────────────────────────
function setupSlider() {
  const slider = document.getElementById('year-slider');
  slider.max   = years.length - 1;
  slider.value = years.length - 1;
  currentIdx   = years.length - 1;

  // Replace input listener (remove old one by cloning)
  const newSlider = slider.cloneNode(true);
  slider.parentNode.replaceChild(newSlider, slider);
  newSlider.addEventListener('input', () => {
    currentIdx = parseInt(newSlider.value);
    updateDisplay();
  });

  const tickContainer = document.getElementById('ticks');
  tickContainer.innerHTML = '';
  const n = years.length;
  const labelEvery = n <= 12 ? 1 : n <= 20 ? 2 : 3;

  years.forEach((year, i) => {
    const pct = n > 1 ? (i / (n - 1)) * 100 : 50;
    const showLabel = (i % labelEvery === 0) || i === n - 1;
    const div = document.createElement('div');
    div.className = 'tick has-obs';
    div.style.left = `${pct}%`;
    div.innerHTML = `<div class="tick-mark"></div><div class="tick-label">${showLabel ? year : ''}</div>`;
    tickContainer.appendChild(div);
  });
}

// ── Overlay layer management ──────────────────────────────────────────────
function buildOverlayLayers(data, butterflYears) {
  overlayByYear = {};
  overlayLayers = {};
  for (const obs of data) {
    (overlayByYear[obs.year] ??= []).push(obs);
  }
  overlayYears = Object.keys(overlayByYear).map(Number).sort((a, b) => a - b);

  for (const yr of overlayYears) {
    const lg = L.layerGroup();
    for (const obs of overlayByYear[yr]) {
      L.marker([obs.lat, obs.lng], { icon: PLANT_ICON })
        .bindPopup(
          `<div class="popup-body">
            <div class="popup-type">🌿 California Pipevine</div>
            <div><em>Aristolochia californica</em></div>
            <div>Date: ${obs.date}</div>
            <div><a href="${obs.url}" target="_blank" rel="noopener">View on iNaturalist ↗</a></div>
          </div>`, { maxWidth: 240 })
        .addTo(lg);
    }
    overlayLayers[yr] = lg;
  }
}

function updateOverlayDisplay(currentYear) {
  for (const yr of overlayYears) {
    const layer = overlayLayers[yr];
    const inRange = showOverlay && (mode === 'annual' ? (yr === currentYear) : (yr <= currentYear));
    if (inRange && !map.hasLayer(layer)) layer.addTo(map);
    if (!inRange && map.hasLayer(layer)) map.removeLayer(layer);
  }
}

function clearOverlayLayers() {
  for (const yr of overlayYears) {
    if (overlayLayers[yr] && map.hasLayer(overlayLayers[yr])) map.removeLayer(overlayLayers[yr]);
  }
  overlayByYear = {}; overlayYears = []; overlayLayers = {};
}

function toggleOverlay() {
  showOverlay = !showOverlay;
  const btn = document.getElementById('overlay-toggle-btn');
  btn.classList.toggle('active', showOverlay);
  btn.classList.toggle('inactive', !showOverlay);
  document.getElementById('overlay-btn-label').textContent =
    showOverlay ? 'CA Pipevine plant' : 'CA Pipevine (hidden)';
  updateDisplay();
}

// ── Remove all current year layers from map ───────────────────────────────
function clearLayers() {
  for (const yr of years) {
    if (yearLayers[yr] && map.hasLayer(yearLayers[yr])) map.removeLayer(yearLayers[yr]);
  }
  clearOverlayLayers();
}

// ── Load species data and render ──────────────────────────────────────────
async function loadSpecies(idx) {
  if (switching) return;
  switching = true;

  speciesIdx = idx;
  const sp = SPECIES[idx];

  // UI update
  setSpeciesColor(sp.color);
  updateTabUI(idx);
  document.getElementById('page-title').textContent = `${sp.name} · San Francisco`;
  document.getElementById('loading-title').textContent = `Loading ${sp.name}…`;
  document.getElementById('progress-bar').style.width = '0%';
  document.getElementById('loading-msg').textContent = `Reading cached data`;
  document.getElementById('loading').style.display = 'flex';

  // Clear previous layers
  clearLayers();
  byYear = {}; years = []; yearLayers = {};

  try {
    const resp = await fetch(sp.dataFile);
    if (!resp.ok) throw new Error(`Could not load ${sp.dataFile}`);
    allObs = await resp.json();
    document.getElementById('progress-bar').style.width = '100%';

    for (const obs of allObs) {
      (byYear[obs.year] ??= []).push(obs);
    }
    years = Object.keys(byYear).map(Number).sort((a, b) => a - b);

    if (years.length === 0) throw new Error('No observations found in data file');

    ICONS = buildIcons(sp.color);
    buildMarkerLayers();

    // Load plant overlay if this species has one
    const overlayBtn = document.getElementById('overlay-toggle-btn');
    if (sp.overlay) {
      const oresp = await fetch(sp.overlay.dataFile);
      if (!oresp.ok) throw new Error(`Could not load ${sp.overlay.dataFile}`);
      const overlayData = await oresp.json();
      showOverlay = true;
      buildOverlayLayers(overlayData, years);
      overlayBtn.style.display = 'flex';
      overlayBtn.classList.add('active');
      overlayBtn.classList.remove('inactive');
      document.getElementById('overlay-btn-label').textContent = 'CA Pipevine plant';
    } else {
      overlayBtn.style.display = 'none';
    }

    setupSlider();
    updateDisplay();
  } catch (err) {
    document.getElementById('loading-msg').textContent = `Error: ${err.message}`;
    switching = false;
    return;
  }

  document.getElementById('loading').style.display = 'none';
  switching = false;
}

// ── Tab UI ────────────────────────────────────────────────────────────────
function buildTabs() {
  const container = document.getElementById('species-tabs');
  SPECIES.forEach((sp, i) => {
    const btn = document.createElement('button');
    btn.className = 'sp-tab' + (i === 0 ? ' active' : '');
    btn.style.setProperty('--tab-color', sp.color);
    btn.innerHTML = `${sp.name}<em>${sp.scientific}</em>`;
    btn.onclick = () => loadSpecies(i);
    container.appendChild(btn);
  });
}

function updateTabUI(idx) {
  document.querySelectorAll('.sp-tab').forEach((el, i) => {
    el.classList.toggle('active', i === idx);
  });
}
